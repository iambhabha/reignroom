name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    name: Site, Worker, protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  agent:
    name: Host agent (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    env:
      VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install websockets==17.3 vgamepad==0.1.0 pytest==9.1.1
      - run: python -m pytest -q
