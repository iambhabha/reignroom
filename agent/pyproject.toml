[project]
name = "reignroom-agent"
version = "0.1.0"
description = "ReignRoom host agent: guests' controller input as virtual pads for PCSX2 (Urban Reign)."
requires-python = ">=3.12"
dependencies = [
  "websockets==17.3",
  # vgamepad 0.1.0 (the only PyPI release) always launches ViGEmBus's interactive installer
  # when the driver is missing, which hangs CI. Upstream 0.1.3 honours
  # VGAMEPAD_SKIP_VIGEMBUS_INSTALL; pinned to its commit.
  "vgamepad @ git+https://github.com/yannbouteiller/vgamepad@3f910aa8bbde49a576683db74ad5e4a0879f8a80",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pyinstaller==6.22.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
